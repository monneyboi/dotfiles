# `rclone serve restic --stdio` runs ON the Storage Box, as the SSH forced
# command pinned to our key in the box's ~/.ssh/authorized_keys:
#   command="rclone serve restic --stdio ./restic",restrict ssh-ed25519 ...
# The box's restricted shell rejects ad-hoc SSH commands, so this is the only
# way. -o options have no env-var equivalent, hence the ExecStart overrides.

[Service]
Environment=RESTIC_REPOSITORY=rclone:restic

ExecStart=
ExecStart=/usr/bin/restic backup --retry-lock=30m -o "rclone.program=ssh storagebox" -o rclone.timeout=5m %h/Documents --verbose
ExecStartPost=
ExecStartPost=/usr/bin/restic forget --keep-daily 7 --keep-weekly 4 --keep-monthly 6 --keep-yearly 1 --retry-lock=30m -o "rclone.program=ssh storagebox" -o rclone.timeout=5m --verbose
