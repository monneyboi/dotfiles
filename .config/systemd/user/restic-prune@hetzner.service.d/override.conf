# --read-data would re-download the entire repository over the WAN on every
# run; a random 25% subset gets full coverage over ~4 runs.

[Service]
Environment=RESTIC_REPOSITORY=rclone:restic

ExecStart=
ExecStart=/usr/bin/restic prune --verbose -o "rclone.program=ssh storagebox" -o rclone.timeout=5m
ExecStart=/usr/bin/restic check --read-data-subset=25% -o "rclone.program=ssh storagebox" -o rclone.timeout=5m
